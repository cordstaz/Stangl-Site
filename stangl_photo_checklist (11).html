  ["Tulip Yellow (Not Terra Rose Line)", "https://www.replacements.com/china-stangl-tulip-yellow-not-terra-rose-line/c/98492"],
  ["Tulip Yellow (Terra Rose Line)", "https://www.replacements.com/china-stangl-tulip-yellow-terra-rose-line/c/98491"],
  ["White Dogwood", "https://www.replacements.com/china-stangl-white-dogwood/c/98493"],
  ["White Dogwood (variant)", "https://www.replacements.com/china-stangl-white-dogwood/c/149010"],
  ["Wild Rose", "https://www.replacements.com/china-stangl-wild-rose/c/98496"]
];

const pieceTypes = [
  "Dinner Plate (10\")", "Salad Plate (8\")", "Bread & Butter Plate (6\")",
  "Cup", "Saucer", "Fruit / Dessert Bowl", "Cereal / Soup Bowl", "Coupe Soup Bowl",
  "Chop Plate / Round Platter (12\"-14\")", "Oval Serving Platter", "Oval Vegetable Bowl",
  "Round Vegetable Bowl", "Divided Vegetable Dish", "Gravy Boat", "Gravy Boat Underplate",
  "Creamer", "Sugar Bowl with Lid", "Teapot", "Coffee Pot", "Salt & Pepper Shakers",
  "Butter Dish", "Egg Cup", "Ashtray", "Mug", "Pitcher", "Casserole Dish with Lid"
];

const PEOPLE = ["cord", "mom"];
const SITE_PASSWORD = "zindulka";

let fbStorage = null;
let view = "home";
let currentPatternIndex = null;

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function initFirebase() {
  const placeholder = "YOUR_FIREBASE";
  const configValues = Object.values(firebaseConfig);
  if (configValues.some(v => v.includes(placeholder))) {
    return false;
  }
  firebase.initializeApp(firebaseConfig);
  fbStorage = firebase.storage();
  return true;
}

function photoPath(patternSlug, pieceSlug, person) {
  return `${patternSlug}--${pieceSlug}--${person}.jpg`;
}

async function loadInventory() {
  if (!fbStorage) return null;
  const countsByPiece = {};
  const countsByPattern = {};
  pieceTypes.forEach(p => countsByPiece[slug(p)] = { cord: 0, mom: 0 });
  patterns.forEach(([name]) => countsByPattern[slug(name)] = { cord: 0, mom: 0 });

  try {
    const result = await fbStorage.ref().listAll();
    result.items.forEach(itemRef => {
      const match = itemRef.name.match(/^(.+)--(.+)--(cord|mom)\.jpg$/);
      if (!match) return;
      const [, pSlug, pieceSlug, person] = match;
      if (countsByPattern[pSlug]) countsByPattern[pSlug][person]++;
      if (countsByPiece[pieceSlug]) countsByPiece[pieceSlug][person]++;
    });
  } catch (err) {
    console.error("Inventory load failed", err);
    return null;
  }

  return { countsByPiece, countsByPattern };
}

function setHeader(title, sub, showBack) {
  document.getElementById('headerTitle').textContent = title;
  document.getElementById('headerSub').textContent = sub;
  const existingBtn = document.getElementById('backBtn');
  if (existingBtn) existingBtn.remove();
  if (showBack) {
    const btn = document.createElement('button');
    btn.id = 'backBtn';
    btn.className = 'back-btn';
    btn.textContent = '\u2190 Patterns';
    btn.onclick = () => { view = 'home'; renderApp(); };
    document.getElementById('headerBar').appendChild(btn);
  }
}

function groupByLetter(list) {
  const groups = {};
  list.forEach(item => {
    const letter = item[0][0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(item);
  });
  return groups;
}

function renderHome() {
  setHeader("Stangl Stash: Mom and Cord's Stangl Collections", "Tap a pattern to open Cord's & Mom's piece checklist", false);
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="home-layout">
      <aside class="dashboard-panel">
        <img src="mom-and-cord.jpg" alt="Mom and Cord" class="home-photo">
        <h2 class="panel-heading">Dashboard</h2>
        <div id="dashboardContent" class="dashboard-content">
          <p class="dashboard-loading">Loading counts...</p>
        </div>
        <button id="refreshDashboard" class="refresh-btn">Refresh counts</button>
      </aside>
      <div class="panel-divider"></div>
      <section class="collections-panel">
        <div class="controls">
          <input type="text" id="searchBox" placeholder="Search patterns...">
        </div>
        <main id="main"></main>
      </section>
    </div>
    <footer>Photos uploaded here are stored in your Firebase project and visible to anyone with this site's link. Piece list is a standard generic set &mdash; not every pattern was produced in every piece type.</footer>
  `;
  document.getElementById('searchBox').addEventListener('input', renderPatternList);
  document.getElementById('refreshDashboard').addEventListener('click', renderDashboard);
  renderPatternList();
  renderDashboard();
}

let charts = { donutCord: null, donutMom: null, pieceChart: null, patternChart: null };

async function renderDashboard() {
  const content = document.getElementById('dashboardContent');
  if (!fbStorage) {
    content.innerHTML = '<p class="dashboard-note">Connect Firebase (see setup notes at the top of this file) to see live counts.</p>';
    return;
  }
  content.innerHTML = '<p class="dashboard-loading">Loading counts...</p>';
  const inv = await loadInventory();
  if (!inv) {
    content.innerHTML = '<p class="dashboard-note">Could not load counts. Check your Firebase setup and Storage rules.</p>';
    return;
  }

  const totalPossiblePerPerson = patterns.length * pieceTypes.length;
  let cordTotal = 0, momTotal = 0;
  Object.values(inv.countsByPattern).forEach(c => { cordTotal += c.cord; momTotal += c.mom; });
  const cordPct = totalPossiblePerPerson ? Math.round((cordTotal / totalPossiblePerPerson) * 100) : 0;
  const momPct = totalPossiblePerPerson ? Math.round((momTotal / totalPossiblePerPerson) * 100) : 0;

  content.innerHTML = `
    <h3 class="dash-subheading">Overall Completion</h3>
    <div class="dash-donuts">
      <div class="donut-wrap">
        <canvas id="donutCord" height="110"></canvas>
        <div class="donut-pct cord">${cordPct}%</div>
        <div class="donut-name">Cord (${cordTotal}/${totalPossiblePerPerson})</div>
      </div>
      <div class="donut-wrap">
        <canvas id="donutMom" height="110"></canvas>
        <div class="donut-pct mom">${momPct}%</div>
        <div class="donut-name">Mom (${momTotal}/${totalPossiblePerPerson})</div>
      </div>
    </div>

    <h3 class="dash-subheading">By Piece Type</h3>
    <div class="dash-legend">
      <span class="dash-legend-item"><span class="dash-legend-swatch cord"></span>Cord</span>
      <span class="dash-legend-item"><span class="dash-legend-swatch mom"></span>Mom</span>
    </div>
    <div class="dash-chart-scroll">
      <canvas id="pieceChart"></canvas>
    </div>

    <h3 class="dash-subheading">By Collection</h3>
    <div class="dash-chart-scroll">
      <canvas id="patternChart"></canvas>
    </div>
  `;

  Object.values(charts).forEach(c => { if (c) c.destroy(); });

  const cordColor = getComputedStyle(document.documentElement).getPropertyValue('--cord').trim() || '#14213d';
  const momColor = getComputedStyle(document.documentElement).getPropertyValue('--mom').trim() || '#a5473c';
  const trackColor = '#e2dccb';

  function makeDonut(canvasId, ownedCount, total, color) {
    const ctx = document.getElementById(canvasId);
    return new Chart(ctx, {
      type: 'doughnut',
      data: {
        datasets: [{
          data: [ownedCount, Math.max(total - ownedCount, 0)],
          backgroundColor: [color, trackColor],
          borderWidth: 0
        }]
      },
      options: {
        cutout: '72%',
        responsive: true,
        plugins: { legend: { display: false }, tooltip: { enabled: false } },
        animation: false
      }
    });
  }

  charts.donutCord = makeDonut('donutCord', cordTotal, totalPossiblePerPerson, cordColor);
  charts.donutMom = makeDonut('donutMom', momTotal, totalPossiblePerPerson, momColor);

  function makeBarChart(canvasId, labels, cordData, momData, rowHeight) {
    const canvas = document.getElementById(canvasId);
    canvas.height = Math.max(labels.length * rowHeight, 120);
    return new Chart(canvas, {
      type: 'bar',
      data: {
        labels: labels,
        datasets: [
          { label: 'Cord', data: cordData, backgroundColor: cordColor },
          { label: 'Mom', data: momData, backgroundColor: momColor }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 } } },
          y: { ticks: { font: { size: 9 } } }
        }
      }
    });
  }

  charts.pieceChart = makeBarChart(
    'pieceChart',
    pieceTypes,
    pieceTypes.map(p => (inv.countsByPiece[slug(p)] || {}).cord || 0),
    pieceTypes.map(p => (inv.countsByPiece[slug(p)] || {}).mom || 0),
    26
  );

  charts.patternChart = makeBarChart(
    'patternChart',
    patterns.map(([name]) => name),
    patterns.map(([name]) => (inv.countsByPattern[slug(name)] || {}).cord || 0),
    patterns.map(([name]) => (inv.countsByPattern[slug(name)] || {}).mom || 0),
    16
  );
}

function renderPatternList() {
  const searchTerm = (document.getElementById('searchBox')?.value || '').toLowerCase();
  const filtered = patterns.filter(([name]) => name.toLowerCase().includes(searchTerm));
  const groups = groupByLetter(filtered);
  const letters = Object.keys(groups).sort();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (letters.length === 0) {
    main.innerHTML = '<div class="empty-note">No patterns match your search.</div>';
  }

  letters.forEach(letter => {
    const heading = document.createElement('h2');
    heading.className = 'letter-heading';
    heading.textContent = letter;
    main.appendChild(heading);

    const rowsGrid = document.createElement('div');
    rowsGrid.className = 'letter-rows-grid';

    groups[letter].forEach(([name, url]) => {
      const row = document.createElement('div');
      row.className = 'pattern-row';
      row.innerHTML = `
        <span class="pattern-name">${name}</span>
        <a class="ext-link" href="${url}" target="_blank" rel="noopener noreferrer" title="View photo">\u2197</a>
      `;
      row.querySelector('.pattern-name').addEventListener('click', () => openDetail(name));
      rowsGrid.appendChild(row);
    });

    main.appendChild(rowsGrid);
  });
}

function openDetail(name) {
  currentPatternIndex = patterns.findIndex(p => p[0] === name);
  view = 'detail';
  renderApp();
}

function renderDetail() {
  const [name, url] = patterns[currentPatternIndex];
  setHeader(name, 'Piece checklist \u2014 Cord & Mom', true);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="detail-header-block">
      <a class="detail-link" href="${url}" target="_blank" rel="noopener noreferrer">View pattern photo on Replacements.com \u2197</a>
      ${!fbStorage ? '<div class="config-warning">Photo uploads are not active yet. Add your Firebase config near the top of this file to enable saving.</div>' : ''}
    </div>
    <main id="pieceList"></main>
  `;

  const pSlug = slug(name);
  const list = document.getElementById('pieceList');
  list.innerHTML = '';

  pieceTypes.forEach(piece => {
    const pieceSlug = slug(piece);
    const block = document.createElement('div');
    block.className = 'piece-block';
    block.innerHTML = `
      <p class="piece-title">${piece}</p>
      <div class="person-row">
        ${PEOPLE.map(person => `
          <div class="person-col">
            <div class="person-label ${person}">${person === 'cord' ? 'Cord' : 'Mom'}</div>
            <div class="photo-slot" id="slot-${pSlug}-${pieceSlug}-${person}">
              <span class="upload-label">Tap to upload</span>
              <input type="file" accept="image/*" id="file-${pSlug}-${pieceSlug}-${person}">
            </div>
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(block);
    PEOPLE.forEach(person => setupSlot(pSlug, pieceSlug, person));
  });
}

function setupSlot(pSlug, pieceSlug, person) {
  const slotId = `slot-${pSlug}-${pieceSlug}-${person}`;
  const fileId = `file-${pSlug}-${pieceSlug}-${person}`;
  const slot = document.getElementById(slotId);
  const fileInput = document.getElementById(fileId);
  const path = photoPath(pSlug, pieceSlug, person);

  slot.addEventListener('click', () => {
    if (slot.querySelector('img')) return;
    if (fbStorage) {
      const currentFileInput = document.getElementById(fileId);
      if (currentFileInput) currentFileInput.click();
    }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    slot.classList.add('uploading');
    slot.querySelector('.upload-label').textContent = 'Uploading...';
    try {
      const ref = fbStorage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      showPhoto(slot, url, path);
    } catch (err) {
      slot.querySelector('.upload-label').textContent = 'Upload failed \u2014 tap to retry';
      slot.classList.remove('uploading');
      console.error(err);
    }
  });

  if (fbStorage) {
    fbStorage.ref().child(path).getDownloadURL()
      .then(url => showPhoto(slot, url, path))
      .catch(() => { /* no photo yet, leave upload prompt */ });
  }
}

function resetSlotToUpload(slot, fileId) {
  slot.classList.remove('uploading');
  slot.style.cursor = 'pointer';
  slot.innerHTML = `
    <span class="upload-label">Tap to upload</span>
    <input type="file" accept="image/*" id="${fileId}">
  `;
  const newFileInput = document.getElementById(fileId);
  return newFileInput;
}

function showPhoto(slot, url, path) {
  slot.classList.remove('uploading');
  slot.innerHTML = `
    <img src="${url}" alt="">
    <button class="delete-photo-btn" type="button" title="Delete photo">&times;</button>
  `;
  slot.style.cursor = 'pointer';

  const img = slot.querySelector('img');
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    openLightbox(url);
  });

  const deleteBtn = slot.querySelector('.delete-photo-btn');
  deleteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this photo?')) return;
    deleteBtn.disabled = true;
    deleteBtn.textContent = '\u2026';
    try {
      await fbStorage.ref().child(path).delete();
      const fileId = slot.id.replace('slot-', 'file-');
      const newFileInput = resetSlotToUpload(slot, fileId);
      newFileInput.addEventListener('change', async () => {
        const file = newFileInput.files[0];
        if (!file) return;
        slot.classList.add('uploading');
        slot.querySelector('.upload-label').textContent = 'Uploading...';
        try {
          const ref = fbStorage.ref().child(path);
          await ref.put(file);
          const newUrl = await ref.getDownloadURL();
          showPhoto(slot, newUrl, path);
        } catch (err) {
          slot.querySelector('.upload-label').textContent = 'Upload failed \u2014 tap to retry';
          slot.classList.remove('uploading');
          console.error(err);
        }
      });
    } catch (err) {
      alert('Could not delete photo. Check your connection and try again.');
      deleteBtn.disabled = false;
      deleteBtn.textContent = '\u00d7';
      console.error(err);
    }
  });
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

document.getElementById('lightboxClose').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

function renderApp() {
  if (view === 'home') renderHome();
  else renderDetail();
}

function initPasswordGate() {
  const gate = document.getElementById('passwordGate');
  const input = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('passwordSubmit');
  const errorMsg = document.getElementById('passwordError');

  if (sessionStorage.getItem('stangl_unlocked') === 'true') {
    gate.style.display = 'none';
    return;
  }

  function tryPassword() {
    if (input.value === SITE_PASSWORD) {
      sessionStorage.setItem('stangl_unlocked', 'true');
      gate.style.display = 'none';
    } else {
      errorMsg.textContent = 'Incorrect password, try again.';
      input.value = '';
    }
  }

  submitBtn.addEventListener('click', tryPassword);
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') tryPassword(); });
  input.focus();
}

(function init() {
  initPasswordGate();
  initFirebase();
  renderApp();
})();
</script>
