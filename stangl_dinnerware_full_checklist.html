<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Stangl Dinnerware Checklist</title>
<style>
  :root {
    --navy: #14213d;
    --gold: #b8860b;
    --cream: #faf6ee;
    --line: #e2dccb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: Georgia, 'Times New Roman', serif;
    background: var(--cream);
    color: #222;
  }
  header {
    background: var(--navy);
    color: var(--cream);
    padding: 20px 16px 16px;
    text-align: center;
    position: relative;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 1.35rem;
    letter-spacing: 0.5px;
  }
  header p {
    margin: 0;
    color: var(--gold);
    font-size: 0.8rem;
  }
  .back-btn {
    position: absolute;
    left: 12px;
    top: 18px;
    background: none;
    border: 1px solid var(--gold);
    color: var(--gold);
    padding: 6px 12px;
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.85rem;
    cursor: pointer;
  }
  .back-btn:hover { background: rgba(184,134,11,0.15); }
  .controls {
    max-width: 720px;
    margin: 14px auto 0;
    padding: 0 16px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }
  .controls input[type="text"] {
    flex: 1;
    min-width: 160px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    font-family: inherit;
    font-size: 0.95rem;
  }
  .controls select {
    padding: 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    font-family: inherit;
  }
  .progress-wrap {
    max-width: 720px;
    margin: 12px auto 0;
    padding: 0 16px;
  }
  .progress-bar {
    background: #ecE5d4;
    border-radius: 8px;
    height: 10px;
    overflow: hidden;
    border: 1px solid var(--line);
  }
  .progress-fill {
    background: var(--gold);
    height: 100%;
    width: 0%;
    transition: width 0.3s ease;
  }
  .progress-label {
    font-size: 0.82rem;
    margin-top: 6px;
    color: #555;
    text-align: right;
  }
  main {
    max-width: 720px;
    margin: 0 auto;
    padding: 14px 16px 40px;
  }
  .letter-heading {
    font-size: 0.9rem;
    color: var(--navy);
    border-bottom: 2px solid var(--gold);
    padding-bottom: 4px;
    margin: 18px 0 8px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .pattern-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 8px;
    border-bottom: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
  }
  .pattern-row:hover { background: #fbf3e0; }
  .pattern-badge {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: var(--line);
    flex-shrink: 0;
  }
  .pattern-badge.has-owned { background: var(--gold); }
  .pattern-name {
    flex: 1;
    font-size: 1rem;
    color: var(--navy);
  }
  .pattern-count {
    font-size: 0.78rem;
    color: #999;
    white-space: nowrap;
  }
  .ext-link {
    color: #999;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 4px 6px;
  }
  .ext-link:hover { color: var(--gold); }

  .detail-header-block {
    max-width: 720px;
    margin: 14px auto 0;
    padding: 0 16px;
  }
  .detail-title {
    font-size: 1.3rem;
    color: var(--navy);
    margin: 0 0 6px;
  }
  .detail-link {
    display: inline-block;
    font-size: 0.85rem;
    color: var(--gold);
    text-decoration: none;
    border: 1px solid var(--gold);
    padding: 5px 12px;
    border-radius: 6px;
    margin-bottom: 10px;
  }
  .detail-link:hover { background: rgba(184,134,11,0.15); }

  .piece-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .piece-row.owned { background: #fbf3e0; }
  .piece-row input[type="checkbox"] {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    accent-color: var(--gold);
  }
  .piece-row label {
    flex: 1;
    font-size: 0.98rem;
    color: #222;
  }
  footer {
    text-align: center;
    font-size: 0.72rem;
    color: #888;
    padding: 10px 20px 26px;
    max-width: 720px;
    margin: 0 auto;
  }
  .empty-note {
    text-align: center;
    color: #888;
    font-size: 0.9rem;
    padding: 20px;
  }
</style>
</head>
<body>

  <h1 id="headerTitle">Stangl Dinnerware Checklist</h1>
  <p id="headerSub">Tap a pattern to open its piece checklist</p>

// Standard generic Stangl dinnerware piece types (common across most mid-century American
// hand-carved dinnerware lines). Not every pattern was produced in every piece type below --
// this is a general checklist, not a pattern-specific inventory.
const pieceTypes = [
  "Dinner Plate (10\")",
  "Salad Plate (8\")",
  "Bread & Butter Plate (6\")",
  "Cup",
  "Saucer",
  "Fruit / Dessert Bowl",
  "Cereal / Soup Bowl",
  "Coupe Soup Bowl",
  "Chop Plate / Round Platter (12\"-14\")",
  "Oval Serving Platter",
  "Oval Vegetable Bowl",
  "Round Vegetable Bowl",
  "Divided Vegetable Dish",
  "Gravy Boat",
  "Gravy Boat Underplate",
  "Creamer",
  "Sugar Bowl with Lid",
  "Teapot",
  "Coffee Pot",
  "Salt & Pepper Shakers",
  "Butter Dish",
  "Egg Cup",
  "Ashtray",
  "Mug",
  "Pitcher",
  "Casserole Dish with Lid"
];

let pieceState = {}; // key: patternSlug -> { pieceSlug: true }
let view = "home";
let currentPatternIndex = null;

function slug(s) {
  return s.toLowerCase().replace(/[^a-z0-9]+/g, '-');
}

async function loadState() {
  try {
    const result = await window.storage.get("piece-state", false);
    if (result && result.value) pieceState = JSON.parse(result.value);
  } catch (e) {
    pieceState = {};
  }
}

async function saveState() {
  try {
    await window.storage.set("piece-state", JSON.stringify(pieceState), false);
  } catch (e) {
    console.error("save failed", e);
  }
}

function patternOwnedCount(pName) {
  const pSlug = slug(pName);
  const st = pieceState[pSlug] || {};
  return Object.values(st).filter(Boolean).length;
}

function totalOwnedAllPatterns() {
  let count = 0;
  patterns.forEach(([name]) => count += patternOwnedCount(name));
  return count;
}

function groupByLetter(list) {
  const groups = {};
  list.forEach(item => {
    const letter = item[0][0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(item);
  });
  return groups;
}

function setHeader(title, sub, showBack) {
  document.getElementById('headerTitle').textContent = title;
  document.getElementById('headerSub').textContent = sub;
  const existingBtn = document.getElementById('backBtn');
  if (existingBtn) existingBtn.remove();
  if (showBack) {
    const btn = document.createElement('button');
    btn.id = 'backBtn';
    btn.className = 'back-btn';
    btn.textContent = '\u2190 Patterns';
    btn.onclick = () => { view = 'home'; renderApp(); };
    document.getElementById('headerBar').appendChild(btn);
  }
}

function renderHome() {
  setHeader('Stangl Dinnerware Checklist', 'Tap a pattern to open its piece checklist', false);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="controls">
      <input type="text" id="searchBox" placeholder="Search patterns...">
      <select id="filterSelect">
        <option value="all">Show all</option>
        <option value="owned">Has pieces checked</option>
        <option value="missing">No pieces checked</option>
      </select>
    </div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-label" id="progressLabel"></div>
    </div>
    <main id="main"></main>
    <footer>Piece checklist uses a standard generic list of common Stangl dinnerware piece types (26 items) &mdash; not every pattern was produced in every piece type. Pattern names link to Replacements, Ltd. for reference photos. Checkmarks save automatically.</footer>
  `;

  document.getElementById('searchBox').addEventListener('input', renderPatternList);
  document.getElementById('filterSelect').addEventListener('change', renderPatternList);
  renderPatternList();
}

function renderPatternList() {
  const searchTerm = (document.getElementById('searchBox')?.value || '').toLowerCase();
  const filter = document.getElementById('filterSelect')?.value || 'all';

  const filtered = patterns.filter(([name]) => {
    const matchesSearch = name.toLowerCase().includes(searchTerm);
    const count = patternOwnedCount(name);
    if (filter === 'owned') return matchesSearch && count > 0;
    if (filter === 'missing') return matchesSearch && count === 0;
    return matchesSearch;
  });

  const groups = groupByLetter(filtered);
  const letters = Object.keys(groups).sort();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (letters.length === 0) {
    main.innerHTML = '<div class="empty-note">No patterns match your search/filter.</div>';
  }

  letters.forEach(letter => {
    const heading = document.createElement('h2');
    heading.className = 'letter-heading';
    heading.textContent = letter;
    main.appendChild(heading);

    groups[letter].forEach(([name, url]) => {
      const count = patternOwnedCount(name);
      const row = document.createElement('div');
      row.className = 'pattern-row';
      row.innerHTML = `
        <span class="pattern-badge ${count > 0 ? 'has-owned' : ''}"></span>
        <span class="pattern-name">${name}</span>
        <span class="pattern-count">${count}/${pieceTypes.length}</span>
        <a class="ext-link" href="${url}" target="_blank" rel="noopener noreferrer" title="View photo">\u2197</a>
      `;
      row.querySelector('.pattern-name').addEventListener('click', () => openDetail(name));
      row.addEventListener('click', (e) => {
        if (e.target.classList.contains('ext-link')) return;
        openDetail(name);
      });
      main.appendChild(row);
    });
  });

  updateHomeProgress();
}

function updateHomeProgress() {
  const total = patterns.length * pieceTypes.length;
  const owned = totalOwnedAllPatterns();
  const pct = total === 0 ? 0 : Math.round((owned / total) * 100);
  const fill = document.getElementById('progressFill');
  const label = document.getElementById('progressLabel');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${owned} of ${total} possible pieces checked across all patterns (${pct}%)`;
}

function openDetail(name) {
  currentPatternIndex = patterns.findIndex(p => p[0] === name);
  view = 'detail';
  renderApp();
}

function renderDetail() {
  const [name, url] = patterns[currentPatternIndex];
  const pSlug = slug(name);
  if (!pieceState[pSlug]) pieceState[pSlug] = {};

  setHeader(name, 'Piece checklist', true);

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="detail-header-block">
      <a class="detail-link" href="${url}" target="_blank" rel="noopener noreferrer">View photo on Replacements.com \u2197</a>
      <div class="progress-wrap" style="padding:0; margin: 8px 0 14px;">
        <div class="progress-bar"><div class="progress-fill" id="detailProgressFill"></div></div>
        <div class="progress-label" id="detailProgressLabel"></div>
      </div>
    </div>
    <main id="pieceList"></main>
  `;

  renderPieceList(pSlug);
}

function renderPieceList(pSlug) {
  const list = document.getElementById('pieceList');
  list.innerHTML = '';

  pieceTypes.forEach(piece => {
    const pieceKey = slug(piece);
    const isOwned = !!pieceState[pSlug][pieceKey];

    const row = document.createElement('div');
    row.className = 'piece-row' + (isOwned ? ' owned' : '');

    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = isOwned;
    const id = 'chk-' + pSlug + '-' + pieceKey;
    checkbox.id = id;
    checkbox.addEventListener('change', async () => {
      if (checkbox.checked) {
        pieceState[pSlug][pieceKey] = true;
      } else {
        delete pieceState[pSlug][pieceKey];
      }
      await saveState();
      renderDetailProgress(pSlug);
      row.classList.toggle('owned', checkbox.checked);
    });

    const label = document.createElement('label');
    label.htmlFor = id;
    label.textContent = piece;

    row.appendChild(checkbox);
    row.appendChild(label);
    list.appendChild(row);
  });

  renderDetailProgress(pSlug);
}

function renderDetailProgress(pSlug) {
  const st = pieceState[pSlug] || {};
  const owned = Object.values(st).filter(Boolean).length;
  const total = pieceTypes.length;
  const pct = Math.round((owned / total) * 100);
  const fill = document.getElementById('detailProgressFill');
  const label = document.getElementById('detailProgressLabel');
  if (fill) fill.style.width = pct + '%';
  if (label) label.textContent = `${owned} of ${total} piece types checked (${pct}%)`;
}

function renderApp() {
  if (view === 'home') renderHome();
  else renderDetail();
}

(async function init() {
  await loadState();
  renderApp();
})();
</script>

</body>
</html>
