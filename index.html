<!--
  =====================================================================
  SETUP INSTRUCTIONS (do this before uploads/dashboard will work)
  =====================================================================
  1. Go to https://console.firebase.google.com, create a free project.
  2. In the project: Build -> Storage -> Get Started -> choose default
     settings (test mode is fine to start).
  3. Storage -> Rules tab -> replace the rules with something like this,
     then click Publish. This allows anyone with the link to read/write
     photos (there's no login system on this site, so treat the link
     itself as the "password"):
       rules_version = '2';
       service firebase.storage {
         match /b/{bucket}/o {
           match /{allPaths=**} {
             allow read, write: if true;
           }
         }
       }
  4. Project Settings (gear icon) -> General -> scroll to "Your apps" ->
     click the web icon (</>) -> register an app (nickname is up to you,
     no hosting needed) -> copy the firebaseConfig object it gives you.
  5. Paste your real values into the firebaseConfig object right below
     this comment, replacing the placeholder text.
  6. Commit this file (as index.html), stangl-stash-logo.png,
     manifest.json, sw.js, icon-192.png, icon-512.png,
     icon-512-maskable.png, and apple-touch-icon.png (all in the SAME
     folder) to your GitHub repo, point your Namecheap domain at GitHub
     Pages, and reload the live site.
  =====================================================================
-->

<script>
  // Chart.js is only loaded from a single CDN by default, and if that
  // specific host is blocked or unreachable on a given network (corporate
  // firewall, an extension, a regional outage), the script just silently
  // never arrives -- no error on the page, charts simply never draw. This
  // tries a few different well-known CDNs in order until one works.
  (function loadChartJs(urls, i) {
    if (i >= urls.length) {
      console.error('Chart.js failed to load from every CDN source tried.');
      return;
    }
    const s = document.createElement('script');
    s.src = urls[i];
    s.onerror = () => loadChartJs(urls, i + 1);
    document.head.appendChild(s);
  })([
    'https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js',
    'https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js',
    'https://unpkg.com/chart.js@4.4.4/dist/chart.umd.min.js'
  ], 0);
</script>

// Chart.js now loads via a fallback chain of CDNs (see the loader script in
// <head>), which means it may still be mid-download at the exact moment the
// dashboard tries to build charts. This waits briefly for it to show up
// before concluding it truly failed, instead of giving a false "never
// loaded" verdict just because of a race with an async script tag.
function waitForChartJs(onReady, onTimeout, maxWaitMs) {
  maxWaitMs = maxWaitMs || 4000;
  const start = Date.now();
  (function poll() {
    if (typeof Chart !== 'undefined') { onReady(); return; }
    if (Date.now() - start > maxWaitMs) { onTimeout(); return; }
    setTimeout(poll, 100);
  })();
}

// Custom pieces are tracked purely by filename existence under
// custom-pieces/<patternSlug>/<url-encoded label>.json -- the label itself
// Custom pieces are tracked by filename existence under
// custom-pieces/<patternSlug>/<10-char-id><url-encoded label>.json -- both
// the stable id and the label live in the filename, so listing that folder
// gives back everything with no need to fetch/parse file contents (the
// same reasoning as before: only list/put/delete calls, never a raw
// fetch() of a download URL).
//
// The id (not the label) is what photo/quantity storage paths are keyed
// on, so renaming a piece later never orphans its photos. Pieces created
// before this existed have no id prefix ("legacy") -- those still work
// exactly as before, keyed on their label, but renaming one starts it
// fresh under the new id-based scheme (see renameCustomPiece).
function generateCustomPieceId() {
  let id = '';
  for (let i = 0; i < 10; i++) id += Math.floor(Math.random() * 16).toString(16);
  return id;
}

// Custom patterns work the same way as custom pieces: a stable id up front
// in the filename, with the name and (optional) reference url encoded into
// the rest of it using "|" as a separator -- a character encodeURIComponent
// always escapes away, so it can never collide with anything a real name
// or url encodes to. Just list()/put(), no fetch() of file contents.
function customPatternMarkerPath(id, name, url) {
  return `custom-patterns/${id}${encodeURIComponent(name)}|${encodeURIComponent(url || '')}.json`;
}

async function loadCustomPatternEntries() {
  if (!fbStorage) return [];
  try {
    const listing = await fbStorage.ref().child('custom-patterns').listAll();
    return listing.items.map((item) => {
      const base = item.name.replace(/\.json$/, '');
      const id = base.slice(0, 10);
      const rest = base.slice(10);
      const sep = rest.indexOf('|');
      if (sep === -1) return null;
      let name, url;
      try { name = decodeURIComponent(rest.slice(0, sep)); } catch (err) { return null; }
      try { url = decodeURIComponent(rest.slice(sep + 1)); } catch (err) { url = ''; }
      return { id, name, url };
    }).filter(Boolean);
  } catch (err) {
    console.error('Failed to load custom patterns', err);
    return [];
  }
}

async function addCustomPatternEntry(name, url) {
  const id = generateCustomPieceId();
  const blob = new Blob(['1'], { type: 'text/plain' });
  await fbStorage.ref().child(customPatternMarkerPath(id, name, url)).put(blob);
}

async function deleteCustomPatternEntry(cp) {

}

// Refreshes the runtime `patterns` list to be built-ins + whatever custom
// patterns currently exist in Firebase. Safe to call repeatedly -- it
// truncates back to just the built-ins first, so nothing gets duplicated.
async function refreshCustomPatterns() {
  const entries = await loadCustomPatternEntries();
  patterns.length = BUILT_IN_PATTERN_COUNT;
  customPatternNames = new Set();
  customPatternByName = new Map();
  entries.forEach((cp) => {
    patterns.push([cp.name, cp.url || '']);
    customPatternNames.add(cp.name);
    customPatternByName.set(cp.name, cp);
  });
  return entries;
}

function customPieceMarkerPath(patternSlug, id, label) {
  return `custom-pieces/${patternSlug}/${id}${encodeURIComponent(label)}.json`;
}

function legacyCustomPieceMarkerPath(patternSlug, label) {
  return `custom-pieces/${patternSlug}/${encodeURIComponent(label)}.json`;
}

async function loadCustomPieces(patternSlug) {
  if (!fbStorage) return [];
  try {
    const listing = await fbStorage.ref().child(`custom-pieces/${patternSlug}`).listAll();
    const result = [];
    listing.items.forEach((item) => {
      const base = item.name.replace(/\.json$/, '');
      const maybeId = base.slice(0, 10);
      if (/^[0-9a-f]{10}$/.test(maybeId)) {
        try {
          result.push({ id: maybeId, label: decodeURIComponent(base.slice(10)), legacy: false });
          return;
        } catch (err) { /* fall through to legacy parse below */ }
      }
      try {
        result.push({ id: null, label: decodeURIComponent(base), legacy: true });
      } catch (err) { /* skip unparseable filename */ }
    });
    return result;
  } catch (err) {
    return [];
  }
}

function customPiecePieceSlug(cp) {

}

async function addCustomPiece(patternSlug, label) {
  const id = generateCustomPieceId();
  const blob = new Blob(['1'], { type: 'text/plain' });
  await fbStorage.ref().child(customPieceMarkerPath(patternSlug, id, label)).put(blob);
}

// Renaming a piece that already has a stable id is instant and safe (photo
// paths are keyed on the id, which never changes). Renaming a legacy piece
// converts it to the new scheme under a fresh id -- any photos/quantities
// already attached to its old (label-based) identity won't carry over
// automatically, since there's no reliable way to move uploaded files
// without a server-side copy operation this static site doesn't have.
async function renameCustomPiece(patternSlug, cp, newLabel) {
  const blob = new Blob(['1'], { type: 'text/plain' });
  if (cp.legacy) {
    const newId = generateCustomPieceId();
    await fbStorage.ref().child(customPieceMarkerPath(patternSlug, newId, newLabel)).put(blob);
    try { await fbStorage.ref().child(legacyCustomPieceMarkerPath(patternSlug, cp.label)).delete(); }
    catch (err) { /* ignore */ }
  } else {
    await fbStorage.ref().child(customPieceMarkerPath(patternSlug, cp.id, newLabel)).put(blob);
    try { await fbStorage.ref().child(customPieceMarkerPath(patternSlug, cp.id, cp.label)).delete(); }
    catch (err) { /* ignore */ }
  }
}

async function deleteCustomPieceMarker(patternSlug, cp) {
  const path = cp.legacy
    ? legacyCustomPieceMarkerPath(patternSlug, cp.label)
    : customPieceMarkerPath(patternSlug, cp.id, cp.label);
  await fbStorage.ref().child(path).delete();
}

// Quantities are tracked the same way as custom pieces: the quantity value
// is encoded directly in the marker filename, so reading them back is just
// a listAll() + filename parse -- no fetch()/content read needed.
async function loadPatternQuantities(patternSlug) {
  if (!fbStorage) return {};
  const result = {};
  try {
    const listing = await fbStorage.ref().child('quantities').listAll();
    const prefix = `${patternSlug}--`;
    listing.items.forEach((item) => {
      const base = item.name.replace(/\.json$/, '');
      if (!base.startsWith(prefix)) return;
      const parts = base.slice(prefix.length).split('--');
      if (parts.length !== 3) return;
      const [pieceSlug, person, qtyStr] = parts;
      const qty = parseInt(qtyStr, 10);
      if (!Number.isFinite(qty)) return;
      result[`${pieceSlug}--${person}`] = qty;
    });
  } catch (err) {
    console.error('Failed to load quantities', err);
  }
  return result;
}

function quantityMarkerPath(patternSlug, pieceSlug, person, qty) {
  return `quantities/${patternSlug}--${pieceSlug}--${person}--${qty}.json`;
}

async function setPatternPieceQuantity(patternSlug, pieceSlug, person, qty, previousQty) {
  if (previousQty != null) {
    try { await fbStorage.ref().child(quantityMarkerPath(patternSlug, pieceSlug, person, previousQty)).delete(); }
    catch (err) { /* ignore if it wasn't there */ }
  }
  const blob = new Blob(['1'], { type: 'text/plain' });
  await fbStorage.ref().child(quantityMarkerPath(patternSlug, pieceSlug, person, qty)).put(blob);
}

async function clearPatternPieceQuantity(patternSlug, pieceSlug, person, previousQty) {
  await fbStorage.ref().child(quantityMarkerPath(patternSlug, pieceSlug, person, previousQty)).delete();
}

async function loadDashboardData() {
  if (!fbStorage) return null;
  const countsByPattern = {};
  const patternPieceDetails = {};
  patterns.forEach(([name]) => {
    countsByPattern[slug(name)] = Object.fromEntries(PEOPLE.map(p => [p, 0]));
    patternPieceDetails[slug(name)] = Object.fromEntries(PEOPLE.map(p => [p, new Set()]));
  });
  const combinedSlots = new Set();
  let items;

  try {
    const result = await fbStorage.ref().listAll();
    items = result.items.filter(itemRef => itemRef.name.match(PHOTO_REGEX));
  } catch (err) {
    console.error("Inventory load failed", err);
    return null;
  }

  items.forEach(itemRef => {
    const match = itemRef.name.match(PHOTO_REGEX);
    const [, pSlug, pieceSlug, person] = match;
    if (countsByPattern[pSlug]) countsByPattern[pSlug][person]++;
    if (patternPieceDetails[pSlug]) patternPieceDetails[pSlug][person].add(pieceSlug);
    combinedSlots.add(pSlug + '--' + pieceSlug);
  });

  // Piece-type diversity: how many distinct patterns have at least one photo
  // of each standard piece type (custom pieces aren't comparable by name
  // across patterns, so they're excluded from this one).
  const pieceDiversity = {};
  pieceTypes.forEach(p => pieceDiversity[slug(p)] = 0);
  Object.values(patternPieceDetails).forEach(detail => {
    const combined = new Set(PEOPLE.flatMap(p => [...detail[p]]));
    combined.forEach(pieceSlug => {
      if (pieceDiversity.hasOwnProperty(pieceSlug)) pieceDiversity[pieceSlug]++;
    });
  });

  // Custom piece counts per pattern (only patterns with at least one show
  // up as a subfolder, so this is cheap in practice).
  const customCountByPattern = {};
  let totalCustomPieces = 0;
  try {
    const listing = await fbStorage.ref().child('custom-pieces').listAll();
    await Promise.all(listing.prefixes.map(async (prefixRef) => {
      try {
        const sub = await prefixRef.listAll();
        customCountByPattern[prefixRef.name] = sub.items.length;
        totalCustomPieces += sub.items.length;
      } catch (err) { /* skip unreadable folder */ }
    }));
  } catch (err) { /* no custom pieces yet */ }

  // Quantity-aware total pieces owned (defaults to 1 per photographed piece
  // when no quantity has been set).
  const quantityMap = {};
  try {
    const qListing = await fbStorage.ref().child('quantities').listAll();
    qListing.items.forEach(item => {
      const base = item.name.replace(/\.json$/, '');
      const parts = base.split('--');
      if (parts.length !== 4) return;
      const [pSlug, pieceSlug, person, qtyStr] = parts;
      const qty = parseInt(qtyStr, 10);
      if (Number.isFinite(qty)) quantityMap[`${pSlug}--${pieceSlug}--${person}`] = qty;
    });
  } catch (err) { /* no quantities set yet */ }

  let totalPiecesOwned = 0;
  items.forEach(itemRef => {
    const match = itemRef.name.match(PHOTO_REGEX);
    const [, pSlug, pieceSlug, person] = match;
    totalPiecesOwned += quantityMap[`${pSlug}--${pieceSlug}--${person}`] || 1;
  });

  return {
    countsByPattern,
    patternPieceDetails,
    combinedTotal: combinedSlots.size,
    pieceDiversity,
    customCountByPattern,
    totalCustomPieces,
    totalPiecesOwned,
    totalPhotosUploaded: items.length
  };
}

async function loadAllPhotos() {
  if (!fbStorage) return [];
  const result = await fbStorage.ref().listAll();
  const items = result.items.filter(itemRef => itemRef.name.match(PHOTO_REGEX));
  const photos = await Promise.all(items.map(async itemRef => {
    const match = itemRef.name.match(PHOTO_REGEX);
    const [, pSlug, pieceSlug, person] = match;
    const url = await itemRef.getDownloadURL();
    return { pSlug, pieceSlug, person, url };
  }));
  return photos;
}

function groupByLetter(list) {
  const groups = {};
  list.forEach(item => {
    const letter = item[0][0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(item);
  });
  Object.values(groups).forEach(group => group.sort((a, b) => a[0].localeCompare(b[0])));
  return groups;
}

async function runAutoCompressOnce() {
  if (autoCompressRanThisSession || !fbStorage) return;
  autoCompressRanThisSession = true;

  let alreadyDone;
  try {
    alreadyDone = await hasCompletedLegacyCompression();
  } catch (err) {
    console.error('Could not check legacy compression status:', err);
    return;
  }
  if (alreadyDone) return;

  const progressEl = document.getElementById('compressProgress');
  try {
    const result = await compressExistingPhotos((current, total, counts) => {
      if (progressEl && counts.compressed > 0) {
        progressEl.textContent = `Optimizing photos, one time only\u2026 ${current}/${total} (${counts.compressed} sped up so far)`;
      }
    });

    const allFailed = result.failed > 0 && result.failed === result.total;
    if (!allFailed) {
      await markLegacyCompressionComplete();
    }

    if (progressEl) {
      if (allFailed) {
        progressEl.textContent = 'Could not optimize existing photos automatically \u2014 this usually means your Firebase project needs CORS enabled. Let me know and I can walk you through it.';
      } else if (result.compressed > 0) {
        progressEl.textContent = `Done \u2014 sped up ${result.compressed} older photo${result.compressed === 1 ? '' : 's'}. This was a one-time cleanup and won't run again.`;
      } else {
        progressEl.textContent = '';
      }
    }
  } catch (err) {
    console.error('Background photo optimization failed:', err);
  }
}

    const total = pieceTypes.length + customCount;
    const pct = total ? combined / total : 0;
    return { name, pSlug, combined, total, pct };

        <div class="stat-card-label">Patterns Started</div>

              }
            });
            charts.overallChart.resize();
          } catch (err) {
            showOverallChartError(`${err.name}: ${err.message}`);
            console.error('Overall chart rendering failed (deferred):', err);
          }
        });
      },
      () => {
        showOverallChartError('the Chart.js library never loaded (likely a network/CDN issue).');

    console.error('Overall chart rendering failed:', err);

  try {
    if (mostComplete.length > 0) {

      function showChartError(message) {
        mcWrap.innerHTML = `<p class="dashboard-note" style="color:#ffb4a3;">Chart couldn't load: ${message}</p>`;
      }

      waitForChartJs(
        () => {
        // Deferred to the next frame: this canvas lives inside a CSS grid
        // column, and grid track widths can resolve after this synchronous
        // script runs. Creating the chart before the browser finishes that
        // layout pass can leave Chart.js measuring a zero-width canvas and
        // silently drawing nothing, even though no error is thrown.
        requestAnimationFrame(() => {
          try {
            const rect = mcCanvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) {
              showChartError(`canvas has zero size (${Math.round(rect.width)}x${Math.round(rect.height)}px) even after layout settled.`);

                  y: { ticks: { font: { size: 9 }, color: tickColor }, grid: { color: gridColor } }
                }
              }
            });
            charts.mostCompleteChart.resize();
          } catch (err) {
            showChartError(`${err.name}: ${err.message}`);
            console.error('Most complete chart rendering failed (deferred):', err);
          }
        });
        },
        () => {
          showChartError('the Chart.js library never loaded (likely a network/CDN issue).');
        }
      );
    }
  } catch (err) {
    console.error('Most complete chart rendering failed:', err);
    const wrapEl = document.getElementById('mostCompleteChartWrap');
    if (wrapEl) wrapEl.innerHTML = `<p class="dashboard-note" style="color:#ffb4a3;">Chart couldn't load: ${err.name}: ${err.message}</p>`;
  }
}

function heatColor(pct) {
  const dark = [74, 53, 33];    // --ink-3 (unstarted)
  const warm = [63, 122, 114];  // --teal (nearly done)
  const mixed = dark.map((c, i) => Math.round(c + (warm[i] - c) * pct));
  return `rgb(${mixed.join(',')})`;
}

// Populates the "This Pattern's Stats" panel on a pattern's own detail
// page, reusing the exact same rendering as the Dashboard's Individual
// Collection Stats section (same donuts, same checklist) so the two never
// drift apart -- just pointed at a single, already-known pattern instead
// of a dropdown-selected one. Reflects state as of when the page loaded,
// same as the Dashboard's own checklist (both need a manual refresh to
// pick up brand-new uploads made elsewhere).
async function renderDetailSidebarStats(pSlug) {
  const container = document.getElementById('categoryStats');
  if (!container) return;
  if (!fbStorage) {
    container.innerHTML = '<p class="dashboard-note">Connect Firebase (see setup notes at the top of this file) to see live counts.</p>';
    return;
  }
  try {
    const inv = await loadDashboardData();
    if (!inv) {
      container.innerHTML = '<p class="dashboard-note">Could not load counts. Check your Firebase setup and Storage rules.</p>';
      return;
    }
    const cordColor = getComputedStyle(document.documentElement).getPropertyValue('--cord').trim() || '#d9a75a';
    const momColor = getComputedStyle(document.documentElement).getPropertyValue('--mom').trim() || '#8faa8b';
    const grandmaColor = getComputedStyle(document.documentElement).getPropertyValue('--grandma').trim() || '#b3565a';
    const emberColor = getComputedStyle(document.documentElement).getPropertyValue('--ember').trim() || '#ef7d4f';
    const personColors = { cord: cordColor, mom: momColor, grandma: grandmaColor };
    await renderCategoryStats(pSlug, inv, personColors, emberColor);
  } catch (err) {
    container.innerHTML = '<p class="dashboard-note">Could not load counts. Check your Firebase setup and Storage rules.</p>';
    console.error('Detail sidebar stats failed:', err);
  }
}

async function renderCategoryStats(pSlug, inv, personColors, emberColor) {
  const container = document.getElementById('categoryStats');
  Object.values(categoryCharts).forEach(c => { if (c) c.destroy(); });
  categoryCharts = Object.fromEntries([...PEOPLE, 'together'].map(k => [k, null]));
  if (!pSlug) {
    container.innerHTML = '';
    return;
  }
  container.innerHTML = '<p class="dashboard-loading">Loading...</p>';
  const patternEntry = patterns.find(([name]) => slug(name) === pSlug);
  const patternName = patternEntry ? patternEntry[0] : pSlug;
  const counts = inv.countsByPattern[pSlug] || emptyCounts();
  const detail = inv.patternPieceDetails[pSlug] || emptyDetail();
  const customPieces = await loadCustomPieces(pSlug);
  const total = pieceTypes.length + customPieces.length;
  const combined = new Set(PEOPLE.flatMap(p => [...detail[p]])).size;
  const personPct = Object.fromEntries(PEOPLE.map(p => [p, total ? Math.round((counts[p] / total) * 100) : 0]));
  const togetherPct = total ? Math.round((combined / total) * 100) : 0;

  function pieceRow(pieceLabel, pieceSlug, isCustom) {
    const marks = PEOPLE.map(p => {
      const has = detail[p].has(pieceSlug);
      return `<span class="category-piece-mark ${p} ${has ? 'yes' : ''}">${has ? '\u2713' : '\u2014'}</span>`;
    }).join('');
    return `
      <div class="category-piece-row" style="grid-template-columns: 1fr repeat(${PEOPLE.length}, 60px);">
        <span class="category-piece-name">${pieceLabel}</span>
        ${marks}
      </div>
    `;
  }

  const allPieces = [
    ...pieceTypes.map(piece => ({ label: piece, pieceSlug: slug(piece) })),
    ...customPieces.map(cp => ({ label: cp.label, pieceSlug: customPiecePieceSlug(cp) }))
  ];
  // Stable sort: pieces with a checkmark from anyone float to the top,
  // otherwise pieces keep their original order within each group.
  const sortedPieces = allPieces
    .map((piece, i) => ({ piece, hasAny: PEOPLE.some(p => detail[p].has(piece.pieceSlug)), i }))
    .sort((a, b) => (b.hasAny - a.hasAny) || (a.i - b.i))
    .map(x => x.piece);

  const rows = sortedPieces.map(p => pieceRow(p.label, p.pieceSlug)).join('');

  container.innerHTML = `
    <div class="category-summary">
      <h4>${patternName}</h4>
    </div>
    <div class="dash-donuts category-donuts">
      ${PEOPLE.map(p => `
        <div class="donut-wrap">
          <canvas id="categoryDonut${p}" height="90"></canvas>
          <div class="donut-pct ${p}">${personPct[p]}%</div>
          <div class="donut-name">${personLabel(p)} (${counts[p]}/${total})</div>
        </div>
      `).join('')}
      <div class="donut-wrap">
        <canvas id="categoryDonutTogether" height="90"></canvas>
        <div class="donut-pct together">${togetherPct}%</div>
        <div class="donut-name">Together (${combined}/${total})</div>
      </div>
    </div>
    <div class="category-piece-list">
      <div class="category-piece-row category-piece-header" style="grid-template-columns: 1fr repeat(${PEOPLE.length}, 60px);">
        <span class="category-piece-name">Piece</span>
        ${PEOPLE.map(p => `<span class="category-piece-mark ${p}">${personLabel(p)}</span>`).join('')}
      </div>
      ${rows}
    </div>
  `;

  try {
    const trackColor = 'rgba(246,236,220,0.1)';
    function makeCategoryDonut(canvasId, ownedCount, totalCount, color) {
      const ctx = document.getElementById(canvasId);
      return new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [ownedCount, Math.max(totalCount - ownedCount, 0)],
            backgroundColor: [color, trackColor],
            borderWidth: 0
          }]
        },
        options: {
          cutout: '72%',
          responsive: true,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          animation: false
        }
      });
    }
    PEOPLE.forEach(p => {
      categoryCharts[p] = makeCategoryDonut(`categoryDonut${p}`, counts[p], total, personColors[p]);
    });
    categoryCharts.together = makeCategoryDonut('categoryDonutTogether', combined, total, emberColor);
  } catch (err) {
    console.error('Category chart rendering failed:', err);
  }
}

function renderPatternList() {
  const searchTerm = (document.getElementById('searchBox')?.value || '').toLowerCase();
  const filtered = patterns.filter(([name]) => name.toLowerCase().includes(searchTerm));
  const groups = groupByLetter(filtered);
  const letters = Object.keys(groups).sort();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (letters.length === 0) {
    main.innerHTML = '<div class="empty-note">No patterns match your search.</div>';
  }

  letters.forEach(letter => {
    const heading = document.createElement('h2');
    heading.className = 'letter-heading';
    heading.textContent = letter;
    main.appendChild(heading);

    const rowsGrid = document.createElement('div');
    rowsGrid.className = 'letter-rows-grid';

    groups[letter].forEach(([name, url]) => {
      const row = document.createElement('div');
      row.className = 'pattern-row';
      row.innerHTML = `
        <span class="pattern-name">${name}</span>
        ${url ? `<a class="ext-link" href="${url}" target="_blank" rel="noopener noreferrer" title="View photo">\u2197</a>` : ''}
      `;
      row.addEventListener('click', (e) => {
        if (e.target.closest('.ext-link')) return;
        openDetail(name);
      });
      rowsGrid.appendChild(row);
    });

    main.appendChild(rowsGrid);
  });
}

function openDetail(name) {
  currentPatternIndex = patterns.findIndex(p => p[0] === name);
  view = 'detail';
  renderApp();
}

function createPieceBlock(pSlug, pieceLabel, pieceSlug, isCustom) {
  const block = document.createElement('div');
  block.className = 'piece-block' + (isCustom ? ' piece-block-custom' : '');
  block.innerHTML = `
    <div class="piece-title-row">
      <p class="piece-title">${pieceLabel}</p>
      ${isCustom ? `
        <span class="piece-title-actions">
          <button class="edit-piece-btn" type="button" title="Edit this piece">&#9998;</button>
          <button class="remove-piece-btn" type="button" title="Remove this piece">&times;</button>
        </span>
      ` : ''}
    </div>
    <div class="person-row">
      ${PEOPLE.map(person => `
        <div class="person-col">
          <div class="person-label ${person}">${personLabel(person)}</div>
          <div class="photo-slot" id="slot-${pSlug}-${pieceSlug}-${person}">
            <span class="upload-label">Tap to upload</span>
            <input type="file" accept="image/*" id="file-${pSlug}-${pieceSlug}-${person}">
          </div>
          <div class="quantity-control" id="qty-${pSlug}-${pieceSlug}-${person}"></div>
        </div>
      `).join('')}
    </div>
  `;
  return block;

function setupQuantityControl(pSlug, pieceSlug, pieceLabel, person, qty) {
  const container = document.getElementById(`qty-${pSlug}-${pieceSlug}-${person}`);
  if (!container) return;
  container.innerHTML = qty
    ? `<span class="quantity-display-wrap">
         <button class="quantity-display" type="button">Quantity: x${qty}</button>
         <button class="quantity-delete-btn" type="button" title="Remove quantity">&times;</button>
       </span>`
    : `<button class="quantity-add-btn" type="button">+ Add Quantity</button>`;

  if (qty) {
    container.querySelector('.quantity-display').addEventListener('click', () => {
      openQuantityModal(pSlug, pieceSlug, pieceLabel, person, qty);
    });
    container.querySelector('.quantity-delete-btn').addEventListener('click', async () => {
      const btn = container.querySelector('.quantity-delete-btn');
      btn.disabled = true;
      try {
        await clearPatternPieceQuantity(pSlug, pieceSlug, person, qty);
        setupQuantityControl(pSlug, pieceSlug, pieceLabel, person, null);
      } catch (err) {
        btn.disabled = false;
        alert('Could not remove quantity. Check your connection and try again.');
        console.error(err);
      }
    });
  } else {
    container.querySelector('.quantity-add-btn').addEventListener('click', () => {
      openQuantityModal(pSlug, pieceSlug, pieceLabel, person, qty);
    });
  }
}

async function loadAndRenderCustomPieces(pSlug) {
  const customPieces = await loadCustomPieces(pSlug);
  const quantities = await loadPatternQuantities(pSlug);
  const container = document.getElementById('customPieceList');
  if (!container) return;
  container.innerHTML = '';
  customPieces.forEach(cp => {
    const pieceSlug = customPiecePieceSlug(cp);
    const block = createPieceBlock(pSlug, cp.label, pieceSlug, true);
    container.appendChild(block);
    PEOPLE.forEach(person => {
      setupSlot(pSlug, pieceSlug, person);
      setupQuantityControl(pSlug, pieceSlug, cp.label, person, quantities[`${pieceSlug}--${person}`]);
    });
    block.querySelector('.remove-piece-btn').addEventListener('click', () => removeCustomPiece(pSlug, cp));
    block.querySelector('.edit-piece-btn').addEventListener('click', () => openEditCustomPieceModal(pSlug, cp));
  });
}

async function removeCustomPiece(pSlug, cp) {
  if (!confirm('Remove this piece from the checklist?\n\n(Any photos already uploaded for it stay in storage but won\'t show here anymore.)')) return;
  try {
    await deleteCustomPieceMarker(pSlug, cp);
    await loadAndRenderCustomPieces(pSlug);
  } catch (err) {
    alert('Could not remove. Check your connection and try again.');
    console.error(err);
  }
}

function splitCustomPieceLabel(label) {
  const match = label.match(/^(.*) \(([^()]*)\)$/);
  if (match) return { name: match[1], size: match[2] };
  return { name: label, size: '' };
}

async function renderPieceListInOrder(pSlug) {
  const uploadedSlugs = await loadPatternPieceUploads(pSlug);
  const quantities = await loadPatternQuantities(pSlug);
  const list = document.getElementById('pieceList');
  if (!list) return; // user navigated away before this finished loading

  const withUploads = pieceTypes.filter(piece => uploadedSlugs.has(slug(piece)));
  const withoutUploads = pieceTypes.filter(piece => !uploadedSlugs.has(slug(piece)));

  list.innerHTML = '';

  function addBlock(piece) {
    const pieceSlug = slug(piece);
    const block = createPieceBlock(pSlug, piece, pieceSlug, false);
    list.appendChild(block);
    PEOPLE.forEach(person => {
      setupSlot(pSlug, pieceSlug, person);
      setupQuantityControl(pSlug, pieceSlug, piece, person, quantities[`${pieceSlug}--${person}`]);
    });
  }

  if (withUploads.length > 0) {
    const heading = document.createElement('h2');
    heading.className = 'letter-heading';
    heading.textContent = '\u2713 Already Uploaded';
    list.appendChild(heading);
    withUploads.forEach(addBlock);

    const heading2 = document.createElement('h2');
    heading2.className = 'letter-heading';
    heading2.textContent = 'Still Needed';
    list.appendChild(heading2);
  }

  withoutUploads.forEach(addBlock);
}

function renderDetail() {
  const [name, url] = patterns[currentPatternIndex];

      <div class="custom-piece-modal-box">
        <button class="custom-piece-modal-close" id="customPieceModalClose" type="button">&times;</button>

        <input type="text" id="customPieceSize" placeholder="Size (optional, e.g. 9&quot; tall)">

      <div class="custom-piece-modal-box">
        <button class="custom-piece-modal-close" id="quantityModalClose" type="button">&times;</button>
        <h3>Set Quantity</h3>
        <p id="quantityModalSubtitle" class="quantity-modal-subtitle"></p>
        <select id="quantitySelect">
          <option value="">Select a quantity&hellip;</option>
          ${Array.from({ length: 19 }, (_, i) => i + 2).map(n => `<option value="${n}">${n}</option>`).join('')}
        </select>
        <div class="custom-piece-form-actions">
          <button id="quantitySave" class="custom-piece-save-btn" type="button">Save</button>
          <button id="quantityCancel" class="custom-piece-cancel-btn" type="button">Cancel</button>

        <p id="quantityError" class="custom-piece-error"></p>
      </div>
    </div>
  `;

  document.getElementById('pieceList').innerHTML = '<p class="dashboard-loading">Loading checklist...</p>';
  renderPieceListInOrder(pSlug);

  loadAndRenderCustomPieces(pSlug);

  renderDetailSidebarStats(pSlug);

  const modal = document.getElementById('customPieceModal');
  const modalTitle = document.getElementById('customPieceModalTitle');
  const nameInput = document.getElementById('customPieceName');
  const sizeInput = document.getElementById('customPieceSize');
  const errorEl = document.getElementById('customPieceError');
  const saveBtn = document.getElementById('customPieceSave');
  editingCustomPiece = null;

  function openCustomPieceModal() {
    editingCustomPiece = null;
    modalTitle.textContent = 'Add a Piece';
    saveBtn.textContent = 'Add Piece';
    nameInput.value = '';
    sizeInput.value = '';
    errorEl.textContent = '';
    modal.classList.add('open');
    nameInput.focus();
  }
  function closeCustomPieceModal() {
    modal.classList.remove('open');
    editingCustomPiece = null;
    nameInput.value = '';
    sizeInput.value = '';
    errorEl.textContent = '';
  }
  window.__openEditCustomPieceModal = (editPSlug, cp) => {
    editingCustomPiece = cp;
    const { name, size } = splitCustomPieceLabel(cp.label);
    modalTitle.textContent = 'Edit Piece';
    saveBtn.textContent = 'Save Changes';
    nameInput.value = name;
    sizeInput.value = size;
    errorEl.textContent = '';
    modal.classList.add('open');
    nameInput.focus();
  };

  document.getElementById('addCustomPieceBtn').onclick = openCustomPieceModal;
  document.getElementById('customPieceModalClose').onclick = closeCustomPieceModal;
  document.getElementById('customPieceCancel').onclick = closeCustomPieceModal;
  modal.onclick = (e) => { if (e.target === modal) closeCustomPieceModal(); };

  const deletePatternBtn = document.getElementById('deletePatternBtn');
  if (deletePatternBtn) {
    deletePatternBtn.onclick = async () => {
      const confirmed = confirm(
        `Delete "${name}" entirely?\n\n` +
        `This removes it from the library. Any photos already uploaded for it ` +
        `will stay in storage but won't be reachable through the site anymore. ` +
        `This can't be undone.`
      );
      if (!confirmed) return;
      deletePatternBtn.disabled = true;
      deletePatternBtn.textContent = 'Deleting...';
      try {
        const cp = customPatternByName.get(name);
        if (cp) await deleteCustomPatternEntry(cp);
        await refreshCustomPatterns();
        openLibrary();
      } catch (err) {
        alert('Could not delete. Check your connection and try again.');
        console.error(err);
        deletePatternBtn.disabled = false;
        deletePatternBtn.textContent = 'Delete This Pattern';
      }
    };
  }

  saveBtn.onclick = async () => {
    const pieceName = nameInput.value.trim();
    const pieceSize = sizeInput.value.trim();
    errorEl.textContent = '';
    if (!fbStorage) {
      errorEl.textContent = 'Connect Firebase (see setup notes at the top of this file) to add pieces.';
      return;
    }
    if (!pieceName) {
      errorEl.textContent = 'Please enter a piece name.';
      return;
    }
    if (pieceName.includes('/') || pieceSize.includes('/')) {
      errorEl.textContent = 'Piece name and size can\'t contain a "/" character.';
      return;
    }
    const label = pieceSize ? `${pieceName} (${pieceSize})` : pieceName;
    const newSlug = slug(label);
    const isEditing = !!editingCustomPiece;
    saveBtn.disabled = true;
    saveBtn.textContent = isEditing ? 'Saving...' : 'Adding...';
    try {
      const existing = await loadCustomPieces(pSlug);
      const others = isEditing
        ? existing.filter(cp => !(cp.legacy === editingCustomPiece.legacy && cp.id === editingCustomPiece.id && cp.label === editingCustomPiece.label))
        : existing;
      const takenSlugs = pieceTypes.map(p => slug(p)).concat(others.map(cp => slug(cp.label)));
      if (takenSlugs.includes(newSlug)) {
        errorEl.textContent = 'This piece is already on the checklist.';
        return;
      }
      if (isEditing) {
        if (editingCustomPiece.legacy) {
          const proceed = confirm(
            'This piece was created before renaming was supported.\n\n' +
            'Renaming it will start it fresh under its new name \u2014 any photos or ' +
            'quantities already added for it won\'t carry over automatically. Continue?'
          );
          if (!proceed) { return; }
        }
        await renameCustomPiece(pSlug, editingCustomPiece, label);
      } else {
        await addCustomPiece(pSlug, label);
      }
      closeCustomPieceModal();
      await loadAndRenderCustomPieces(pSlug);
    } catch (err) {
      errorEl.textContent = 'Could not save. Check your connection and try again.';
      console.error(err);
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = isEditing ? 'Save Changes' : 'Add Piece';
    }
  };

  const qtyModal = document.getElementById('quantityModal');
  const qtySelect = document.getElementById('quantitySelect');
  const qtyError = document.getElementById('quantityError');
  const qtySaveBtn = document.getElementById('quantitySave');
  const qtyRemoveBtn = document.getElementById('quantityRemoveBtn');

  document.getElementById('quantityModalClose').onclick = closeQuantityModal;
  document.getElementById('quantityCancel').onclick = closeQuantityModal;
  qtyModal.onclick = (e) => { if (e.target === qtyModal) closeQuantityModal(); };

  qtySaveBtn.onclick = async () => {
    qtyError.textContent = '';
    const val = qtySelect.value;
    if (!val) {
      qtyError.textContent = 'Please select a quantity.';
      return;
    }
    const qty = parseInt(val, 10);
    const ctx = quantityEditContext;
    if (!ctx) return;
    qtySaveBtn.disabled = true;
    try {
      await setPatternPieceQuantity(ctx.pSlug, ctx.pieceSlug, ctx.person, qty, ctx.currentQty);
      setupQuantityControl(ctx.pSlug, ctx.pieceSlug, ctx.pieceLabel, ctx.person, qty);
      closeQuantityModal();
    } catch (err) {
      qtyError.textContent = 'Could not save. Check your connection and try again.';
      console.error(err);
    } finally {
      qtySaveBtn.disabled = false;
    }
  };

  qtyRemoveBtn.onclick = async () => {
    const ctx = quantityEditContext;
    if (!ctx || ctx.currentQty == null) return;
    qtyError.textContent = '';
    qtyRemoveBtn.disabled = true;
    try {
      await clearPatternPieceQuantity(ctx.pSlug, ctx.pieceSlug, ctx.person, ctx.currentQty);
      setupQuantityControl(ctx.pSlug, ctx.pieceSlug, ctx.pieceLabel, ctx.person, null);
      closeQuantityModal();
    } catch (err) {
      qtyError.textContent = 'Could not remove. Check your connection and try again.';
      console.error(err);
    } finally {
      qtyRemoveBtn.disabled = false;
    }
  };
}

// Phone camera photos are commonly several MB each and don't need to be
// that large for a small checklist thumbnail or gallery tile. This resizes
// to a reasonable max dimension and re-encodes as JPEG before upload,
// which is what actually keeps uploads fast and the gallery ("Cord or Mom",
// which loads every photo at once) from having to pull down potentially
// hundreds of megabytes of full-resolution originals.
function compressImage(file, maxDimension = 1600, quality = 0.82) {
  return new Promise((resolve) => {
    // Non-image files or anything the browser can't decode just pass through
    // untouched rather than failing the upload.
    if (!file.type || !file.type.startsWith('image/')) {
      resolve(file);
      return;
    }
    const img = new Image();
    const objectUrl = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(objectUrl);
      let { width, height } = img;
      const scale = Math.min(1, maxDimension / Math.max(width, height));
      const targetW = Math.round(width * scale);
      const targetH = Math.round(height * scale);
      const canvas = document.createElement('canvas');
      canvas.width = targetW;
      canvas.height = targetH;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, targetW, targetH);
      canvas.toBlob((blob) => {
        resolve(blob || file);
      }, 'image/jpeg', quality);
    };
    img.onerror = () => {
      URL.revokeObjectURL(objectUrl);
      resolve(file); // couldn't decode it client-side -- upload as-is
    };
    img.src = objectUrl;
  });
}

// Marks the legacy photo cleanup as permanently done, stored in Firebase
// itself so it stays remembered across every future visit, on any device
// -- not just this browser's session. Once this exists, the site never
// scans photos again: new uploads are already compressed at upload time,
// so a one-time pass over old photos is genuinely all that's ever needed.
const LEGACY_COMPRESS_MARKER = 'system/legacy-photos-compressed.json';

async function hasCompletedLegacyCompression() {
  try {
    await fbStorage.ref().child(LEGACY_COMPRESS_MARKER).getDownloadURL();
    return true;
  } catch (err) {
    return false;
  }
}

async function markLegacyCompressionComplete() {
  const blob = new Blob(['1'], { type: 'text/plain' });
  await fbStorage.ref().child(LEGACY_COMPRESS_MARKER).put(blob);
}

// One-time cleanup for photos uploaded before compression existed. Goes
// through every existing photo, skips anything already small, and
// re-uploads the rest through the same compressImage() pipeline used for
// new uploads. Safe to stop/re-run: already-small photos are skipped every
// time, so nothing gets double-processed.
async function compressExistingPhotos(onProgress) {
  const result = await fbStorage.ref().listAll();
  const items = result.items.filter(itemRef => itemRef.name.match(PHOTO_REGEX));
  let compressed = 0, skipped = 0, failed = 0;
  const SKIP_UNDER_BYTES = 600 * 1024;

  for (let i = 0; i < items.length; i++) {
    const itemRef = items[i];
    onProgress(i + 1, items.length, { compressed, skipped, failed });
    try {
      const meta = await itemRef.getMetadata();
      if (meta.size && meta.size < SKIP_UNDER_BYTES) {
        skipped++;
        continue;
      }
      const url = await itemRef.getDownloadURL();
      const response = await fetch(url);
      if (!response.ok) throw new Error('Fetch failed: ' + response.status);
      const blob = await response.blob();
      const compressedBlob = await compressImage(blob);
      await itemRef.put(compressedBlob);
      compressed++;
    } catch (err) {
      console.error('Failed to compress', itemRef.name, err);
      failed++;
    }
  }

  onProgress(items.length, items.length, { compressed, skipped, failed });
  return { total: items.length, compressed, skipped, failed };
}

function setupSlot(pSlug, pieceSlug, person) {
  const slotId = `slot-${pSlug}-${pieceSlug}-${person}`;
  const fileId = `file-${pSlug}-${pieceSlug}-${person}`;
  const slot = document.getElementById(slotId);
  const fileInput = document.getElementById(fileId);
  const path = photoPath(pSlug, pieceSlug, person);

  slot.addEventListener('click', () => {
    if (slot.querySelector('img')) return;
    if (fbStorage) {
      const currentFileInput = document.getElementById(fileId);
      if (currentFileInput) currentFileInput.click();
    }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    slot.classList.add('uploading');
    slot.querySelector('.upload-label').textContent = 'Uploading...';
    try {
      const toUpload = await compressImage(file);
      const ref = fbStorage.ref().child(path);
      await ref.put(toUpload);
      const url = await ref.getDownloadURL();
      showPhoto(slot, url, path);
    } catch (err) {
      slot.querySelector('.upload-label').textContent = 'Upload failed \u2014 tap to retry';
      slot.classList.remove('uploading');
      console.error(err);
    }
  });

  if (fbStorage) {
    fbStorage.ref().child(path).getDownloadURL()
      .then(url => showPhoto(slot, url, path))
      .catch(() => { /* no photo yet, leave upload prompt */ });
  }
}

function resetSlotToUpload(slot, fileId) {
  slot.classList.remove('uploading');
  slot.style.cursor = 'pointer';
  slot.innerHTML = `
    <span class="upload-label">Tap to upload</span>
    <input type="file" accept="image/*" id="${fileId}">
  `;
  const newFileInput = document.getElementById(fileId);
  return newFileInput;
}

function showPhoto(slot, url, path) {
  slot.classList.remove('uploading');
  slot.innerHTML = `
    <img src="${url}" alt="" loading="lazy">
    <button class="delete-photo-btn" type="button" title="Delete photo">&times;</button>
  `;
  slot.style.cursor = 'pointer';

  const img = slot.querySelector('img');
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    openLightbox(url);
  });

  const deleteBtn = slot.querySelector('.delete-photo-btn');
  deleteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this photo?')) return;
    deleteBtn.disabled = true;
    deleteBtn.textContent = '\u2026';
    try {
      await fbStorage.ref().child(path).delete();
      const fileId = slot.id.replace('slot-', 'file-');
      const newFileInput = resetSlotToUpload(slot, fileId);
      newFileInput.addEventListener('change', async () => {
        const file = newFileInput.files[0];
        if (!file) return;
        slot.classList.add('uploading');
        slot.querySelector('.upload-label').textContent = 'Uploading...';
        try {
          const toUpload = await compressImage(file);
          const ref = fbStorage.ref().child(path);
          await ref.put(toUpload);
          const newUrl = await ref.getDownloadURL();
          showPhoto(slot, newUrl, path);
        } catch (err) {
          slot.querySelector('.upload-label').textContent = 'Upload failed \u2014 tap to retry';
          slot.classList.remove('uploading');
          console.error(err);
        }
      });
    } catch (err) {
      alert('Could not delete photo. Check your connection and try again.');
      deleteBtn.disabled = false;
      deleteBtn.textContent = '\u00d7';
      console.error(err);
    }
  });
}

function openGallery() {
  view = 'gallery';
  renderApp();
}

async function renderGallery() {
  setHeader(false);
  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="page-subtitle">Mom, Grandma and Cord's Stangl Stash</p>
    <div class="gallery-controls">
      <input type="text" id="gallerySearch" placeholder="Search patterns or pieces...">
      <select id="galleryPersonFilter">
        <option value="everyone" selected>Everyone</option>
        <option value="anyone">Anyone</option>
        ${PEOPLE.map(p => `<option value="${p}">${personLabel(p)} only</option>`).join('')}
      </select>
    </div>
    <div id="galleryGrid" class="gallery-grid"><p class="dashboard-loading">Loading photos...</p></div>
  `;

  if (!fbStorage) {
    document.getElementById('galleryGrid').innerHTML = '<p class="dashboard-note">Connect Firebase (see setup notes at the top of this file) to see uploaded photos.</p>';
    return;
  }

  let photos;
  try {
    photos = await loadAllPhotos();
  } catch (err) {
    document.getElementById('galleryGrid').innerHTML = '<p class="dashboard-note">Could not load photos. Check your Firebase setup and Storage rules.</p>';
    console.error(err);
    return;
  }

  const patternBySlug = new Map(patterns.map(([name]) => [slug(name), name]));
  const pieceBySlug = new Map(pieceTypes.map(p => [slug(p), p]));

  photos.forEach(p => {
    p.patternName = patternBySlug.get(p.pSlug) || p.pSlug;
    p.pieceName = pieceBySlug.get(p.pieceSlug) || p.pieceSlug;
  });

  photos.sort((a, b) =>
    a.patternName.localeCompare(b.patternName) ||
    a.pieceName.localeCompare(b.pieceName) ||
    a.person.localeCompare(b.person)
  );

  window.__galleryPhotos = photos;
  applyGalleryFilters();

  document.getElementById('gallerySearch').addEventListener('input', applyGalleryFilters);
  document.getElementById('galleryPersonFilter').addEventListener('change', applyGalleryFilters);
}

function getPairsWithEveryone(photos) {
  const setsByPerson = Object.fromEntries(PEOPLE.map(p => [p, new Set()]));
  photos.forEach(p => {
    const key = `${p.pSlug}--${p.pieceSlug}`;
    if (setsByPerson[p.person]) setsByPerson[p.person].add(key);
  });
  const result = new Set();
  setsByPerson[PEOPLE[0]].forEach(key => {
    if (PEOPLE.every(p => setsByPerson[p].has(key))) result.add(key);
  });
  return result;
}

function applyGalleryFilters() {
  const term = (document.getElementById('gallerySearch').value || '').toLowerCase();
  const personFilter = document.getElementById('galleryPersonFilter').value;
  const allPhotos = window.__galleryPhotos || [];

  let base = allPhotos;
  if (personFilter === 'everyone') {
    const everyonePairs = getPairsWithEveryone(allPhotos);
    base = allPhotos.filter(p => everyonePairs.has(`${p.pSlug}--${p.pieceSlug}`));
  } else if (PEOPLE.includes(personFilter)) {
    base = allPhotos.filter(p => p.person === personFilter);
  }
  // 'anyone' shows everything, no person-based exclusion

  const filtered = base.filter(p =>
    p.patternName.toLowerCase().includes(term) || p.pieceName.toLowerCase().includes(term)
  );
  renderGalleryGrid(filtered);
}

function renderGalleryGrid(photos) {
  const grid = document.getElementById('galleryGrid');
  if (photos.length === 0) {
    grid.innerHTML = '<div class="empty-note">No uploaded photos match yet.</div>';
    return;
  }
  grid.innerHTML = '';
  photos.forEach(p => {
    const tile = document.createElement('div');
    tile.className = 'gallery-tile';
    tile.innerHTML = `
      <div class="gallery-thumb"><img src="${p.url}" alt="" loading="lazy"></div>
      <div class="gallery-caption">
        <span class="gallery-pattern">${p.patternName}</span>
        <span class="gallery-piece">${p.pieceName}</span>
        <span class="gallery-person ${p.person}">${personLabel(p.person)}</span>
      </div>
    `;
    tile.querySelector('.gallery-thumb').addEventListener('click', () => openLightbox(p.url));
    tile.querySelector('.gallery-caption').addEventListener('click', () => openDetail(p.patternName));
    grid.appendChild(tile);
  });
}

function renderApp() {
  if (view === 'dashboard') renderDashboardPage();
  else if (view === 'library') renderLibraryPage();
  else if (view === 'gallery') renderGallery();
  else renderDetail();
  updateNavActive();
  window.scrollTo(0, 0);
}

function initPasswordGate() {
  const gate = document.getElementById('passwordGate');
  const input = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('passwordSubmit');
  const errorMsg = document.getElementById('passwordError');

  if (sessionStorage.getItem('stangl_unlocked') === 'true') {
    gate.style.display = 'none';
    return;
  }

  function tryPassword() {
    if (input.value === SITE_PASSWORD) {
      sessionStorage.setItem('stangl_unlocked', 'true');
      gate.style.display = 'none';
    } else {
      errorMsg.textContent = 'Incorrect password, try again.';
      input.value = '';
    }
  }

  submitBtn.addEventListener('click', tryPassword);
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') tryPassword(); });
  input.focus();
}

function initNav() {
  function handleNavClick(e) {
    const btn = e.target.closest('.nav-btn, .floating-nav-btn');
    if (!btn) return;
    const dest = btn.dataset.nav;
    if (dest === 'dashboard') openDashboard();
    else if (dest === 'library') openLibrary();
    else if (dest === 'gallery') openGallery();
  }
  document.getElementById('siteNav').addEventListener('click', handleNavClick);
  document.getElementById('floatingNav').addEventListener('click', handleNavClick);
}

function isStandaloneApp() {
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOSDevice() {
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isAndroidDevice() {
  return /android/i.test(navigator.userAgent);
}

let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});
window.addEventListener('appinstalled', () => {
  const btn = document.getElementById('installBtn');
  if (btn) btn.hidden = true;
});

function openInstallModal(html) {
  document.getElementById('installModalContent').innerHTML = html;
  document.getElementById('installModal').classList.add('open');
}
function closeInstallModal() {
  document.getElementById('installModal').classList.remove('open');
}

function initInstallButton() {
  const btn = document.getElementById('installBtn');
  if (!btn) return;
  if (isStandaloneApp()) {
    btn.hidden = true;
    return;
  }
  btn.addEventListener('click', async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      try { await deferredInstallPrompt.userChoice; } catch (e) {}
      deferredInstallPrompt = null;
      return;
    }
    if (isIOSDevice()) {
      openInstallModal(`
        <h3>Install Stangl Stash</h3>
        <p>1. Tap the <strong>Share</strong> button (the square with an arrow pointing up) in Safari's toolbar.</p>
        <p>2. Scroll down and tap <strong>Add to Home Screen</strong>.</p>
        <p>3. Tap <strong>Add</strong> in the top right.</p>
        <p>It'll show up as its own app icon, no browser bar.</p>
      `);
      return;
    }
    if (isAndroidDevice()) {
      openInstallModal(`
        <h3>Install Stangl Stash</h3>
        <p>Tap the menu button (usually <strong>&#8942;</strong>) in your browser's toolbar.</p>
        <p>Choose <strong>Install app</strong> or <strong>Add to Home Screen</strong>.</p>
      `);
      return;
    }
    openInstallModal(`
      <h3>Install Stangl Stash</h3>
      <p>Open this page on your phone in Chrome or Safari, then use the browser's menu to add it to your home screen.</p>
    `);
  });
  document.getElementById('installModalClose').addEventListener('click', closeInstallModal);
  document.getElementById('installModal').addEventListener('click', (e) => {
    if (e.target.id === 'installModal') closeInstallModal();
  });
}

(async function init() {
  initPasswordGate();
  initFirebase();
  await refreshCustomPatterns();
  initNav();
  initInstallButton();
  renderApp();
})();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((err) => {
      console.error('Service worker registration failed:', err);
    });
  });
}
</script>

</body>
</html>
