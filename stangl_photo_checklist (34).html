<!--
  =====================================================================
  SETUP INSTRUCTIONS (do this before uploads/dashboard will work)
  =====================================================================
  1. Go to https://console.firebase.google.com, create a free project.
  2. In the project: Build -> Storage -> Get Started -> choose default
     settings (test mode is fine to start).
  3. Storage -> Rules tab -> replace the rules with something like this,
     then click Publish. This allows anyone with the link to read/write
     photos (there's no login system on this site, so treat the link
     itself as the "password"):
       rules_version = '2';
       service firebase.storage {
         match /b/{bucket}/o {
           match /{allPaths=**} {
             allow read, write: if true;
           }
         }
       }
  4. Project Settings (gear icon) -> General -> scroll to "Your apps" ->
     click the web icon (</>) -> register an app (nickname is up to you,
     no hosting needed) -> copy the firebaseConfig object it gives you.
  5. Paste your real values into the firebaseConfig object right below
     this comment, replacing the placeholder text.
  6. Commit this file (mom-and-cord.jpg, and stangl-stash-logo.png) to
     your GitHub repo, point your Namecheap domain at GitHub Pages, and
     reload the live site.
  =====================================================================
-->

function slug(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, '-'); }

function initFirebase() {
  const placeholder = "YOUR_FIREBASE";
  const configValues = Object.values(firebaseConfig);
  if (configValues.some(v => v.includes(placeholder))) {
    return false;
  }
  firebase.initializeApp(firebaseConfig);
  fbStorage = firebase.storage();
  return true;
}

function photoPath(patternSlug, pieceSlug, person) {
  return `${patternSlug}--${pieceSlug}--${person}.jpg`;
}

async function loadDashboardData() {
  if (!fbStorage) return null;
  const countsByPiece = {};
  const countsByPattern = {};
  const patternPieceDetails = {};
  pieceTypes.forEach(p => countsByPiece[slug(p)] = { cord: 0, mom: 0 });
  patterns.forEach(([name]) => {
    countsByPattern[slug(name)] = { cord: 0, mom: 0 };
    patternPieceDetails[slug(name)] = { cord: new Set(), mom: new Set() };
  });
  const combinedSlots = new Set();
  let items;

  try {
    const result = await fbStorage.ref().listAll();
    items = result.items.filter(itemRef => itemRef.name.match(/^(.+)--(.+)--(cord|mom)\.jpg$/));
  } catch (err) {
    console.error("Inventory load failed", err);
    return null;
  }

  items.forEach(itemRef => {
    const match = itemRef.name.match(/^(.+)--(.+)--(cord|mom)\.jpg$/);
    const [, pSlug, pieceSlug, person] = match;
    if (countsByPattern[pSlug]) countsByPattern[pSlug][person]++;
    if (countsByPiece[pieceSlug]) countsByPiece[pieceSlug][person]++;
    if (patternPieceDetails[pSlug]) patternPieceDetails[pSlug][person].add(pieceSlug);
    combinedSlots.add(pSlug + '--' + pieceSlug);
  });

  let timeline = [];
  try {
    const metas = await Promise.all(items.map(itemRef => itemRef.getMetadata().catch(() => null)));
    const weekCounts = new Map();
    metas.forEach(meta => {
      if (!meta || !meta.timeCreated) return;
      const d = new Date(meta.timeCreated);
      const weekStart = new Date(d.getFullYear(), d.getMonth(), d.getDate() - d.getDay());
      const key = weekStart.toISOString().slice(0, 10);
      weekCounts.set(key, (weekCounts.get(key) || 0) + 1);
    });
    timeline = Array.from(weekCounts.entries())
      .sort((a, b) => a[0].localeCompare(b[0]))
      .map(([weekStart, count]) => ({ weekStart, count }));
  } catch (err) {
    console.error("Timeline load failed", err);
  }

  return { countsByPiece, countsByPattern, patternPieceDetails, combinedTotal: combinedSlots.size, timeline };
}

async function loadAllPhotos() {
  if (!fbStorage) return [];
  const result = await fbStorage.ref().listAll();
  const items = result.items.filter(itemRef => itemRef.name.match(/^(.+)--(.+)--(cord|mom)\.jpg$/));
  const photos = await Promise.all(items.map(async itemRef => {
    const match = itemRef.name.match(/^(.+)--(.+)--(cord|mom)\.jpg$/);
    const [, pSlug, pieceSlug, person] = match;
    const url = await itemRef.getDownloadURL();
    return { pSlug, pieceSlug, person, url };
  }));
  return photos;
}

function groupByLetter(list) {
  const groups = {};
  list.forEach(item => {
    const letter = item[0][0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(item);
  });
  return groups;
}

  if (topPatterns.length > 0) {
    const canvas = document.getElementById('topChart');
    canvas.height = Math.max(topPatterns.length * 34, 120);
    charts.topChart = new Chart(canvas, {
      type: 'bar',
      data: {
        labels: topPatterns.map(p => p.name),
        datasets: [
          { label: 'Cord', data: topPatterns.map(p => p.cord), backgroundColor: cordColor, borderRadius: 3 },
          { label: 'Mom', data: topPatterns.map(p => p.mom), backgroundColor: momColor, borderRadius: 3 }
        ]
      },
      options: {
        indexAxis: 'y',
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { stacked: true, beginAtZero: true, ticks: { stepSize: 1, font: { size: 10 }, color: tickColor }, grid: { color: gridColor } },
          y: { stacked: true, ticks: { font: { size: 10 }, color: tickColor }, grid: { display: false } }
        }
      }
    });
  }

  if (inv.timeline.length >= 2) {
    const canvas = document.getElementById('timelineChart');
    canvas.height = 160;
    const labels = inv.timeline.map(t => {
      const d = new Date(t.weekStart + 'T00:00:00');
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    });
    charts.timelineChart = new Chart(canvas, {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Photos added',
          data: inv.timeline.map(t => t.count),
          borderColor: emberColor,
          backgroundColor: 'rgba(201,106,48,0.2)',
          fill: true,
          tension: 0.35,
          pointRadius: 3,
          pointBackgroundColor: emberColor
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { font: { size: 9 }, color: tickColor }, grid: { display: false } },
          y: { beginAtZero: true, ticks: { stepSize: 1, font: { size: 9 }, color: tickColor }, grid: { color: gridColor } }
        }
      }
    });
  }

  } catch (err) {
    console.error('Chart rendering failed:', err);
  }
}

function renderCategoryStats(pSlug, inv, cordColor, momColor, emberColor) {
  const container = document.getElementById('categoryStats');
  Object.values(categoryCharts).forEach(c => { if (c) c.destroy(); });
  categoryCharts = { cord: null, mom: null, together: null };
  if (!pSlug) {
    container.innerHTML = '';
    return;
  }
  const patternEntry = patterns.find(([name]) => slug(name) === pSlug);
  const patternName = patternEntry ? patternEntry[0] : pSlug;
  const counts = inv.countsByPattern[pSlug] || { cord: 0, mom: 0 };
  const detail = inv.patternPieceDetails[pSlug] || { cord: new Set(), mom: new Set() };
  const total = pieceTypes.length;
  const combined = new Set([...detail.cord, ...detail.mom]).size;
  const cordPct = total ? Math.round((counts.cord / total) * 100) : 0;
  const momPct = total ? Math.round((counts.mom / total) * 100) : 0;
  const togetherPct = total ? Math.round((combined / total) * 100) : 0;

  const rows = pieceTypes.map(piece => {
    const pieceSlug = slug(piece);
    const hasCord = detail.cord.has(pieceSlug);
    const hasMom = detail.mom.has(pieceSlug);
    return `
      <div class="category-piece-row">
        <span class="category-piece-name">${piece}</span>
        <span class="category-piece-mark cord ${hasCord ? 'yes' : ''}">${hasCord ? '\u2713' : '\u2014'}</span>
        <span class="category-piece-mark mom ${hasMom ? 'yes' : ''}">${hasMom ? '\u2713' : '\u2014'}</span>
      </div>
    `;
  }).join('');

  container.innerHTML = `
    <div class="category-summary">
      <h4>${patternName}</h4>
    </div>
    <div class="dash-donuts category-donuts">
      <div class="donut-wrap">
        <canvas id="categoryDonutCord" height="90"></canvas>
        <div class="donut-pct cord">${cordPct}%</div>
        <div class="donut-name">Cord (${counts.cord}/${total})</div>
      </div>
      <div class="donut-wrap">
        <canvas id="categoryDonutMom" height="90"></canvas>
        <div class="donut-pct mom">${momPct}%</div>
        <div class="donut-name">Mom (${counts.mom}/${total})</div>
      </div>
      <div class="donut-wrap">
        <canvas id="categoryDonutTogether" height="90"></canvas>
        <div class="donut-pct together">${togetherPct}%</div>
        <div class="donut-name">Together (${combined}/${total})</div>
      </div>
    </div>
    <div class="category-piece-list">
      <div class="category-piece-row category-piece-header">
        <span class="category-piece-name">Piece</span>
        <span class="category-piece-mark cord">Cord</span>
        <span class="category-piece-mark mom">Mom</span>
      </div>
      ${rows}
    </div>
  `;

  try {
    const trackColor = 'rgba(246,236,220,0.1)';
    function makeCategoryDonut(canvasId, ownedCount, totalCount, color) {
      const ctx = document.getElementById(canvasId);
      return new Chart(ctx, {
        type: 'doughnut',
        data: {
          datasets: [{
            data: [ownedCount, Math.max(totalCount - ownedCount, 0)],
            backgroundColor: [color, trackColor],
            borderWidth: 0
          }]
        },
        options: {
          cutout: '72%',
          responsive: true,
          plugins: { legend: { display: false }, tooltip: { enabled: false } },
          animation: false
        }
      });
    }
    categoryCharts.cord = makeCategoryDonut('categoryDonutCord', counts.cord, total, cordColor);
    categoryCharts.mom = makeCategoryDonut('categoryDonutMom', counts.mom, total, momColor);
    categoryCharts.together = makeCategoryDonut('categoryDonutTogether', combined, total, emberColor);
  } catch (err) {
    console.error('Category chart rendering failed:', err);
  }
}

function renderPatternList() {
  const searchTerm = (document.getElementById('searchBox')?.value || '').toLowerCase();
  const filtered = patterns.filter(([name]) => name.toLowerCase().includes(searchTerm));
  const groups = groupByLetter(filtered);
  const letters = Object.keys(groups).sort();
  const main = document.getElementById('main');
  main.innerHTML = '';

  if (letters.length === 0) {
    main.innerHTML = '<div class="empty-note">No patterns match your search.</div>';
  }

  letters.forEach(letter => {
    const heading = document.createElement('h2');
    heading.className = 'letter-heading';
    heading.textContent = letter;
    main.appendChild(heading);

    const rowsGrid = document.createElement('div');
    rowsGrid.className = 'letter-rows-grid';

    groups[letter].forEach(([name, url]) => {
      const row = document.createElement('div');
      row.className = 'pattern-row';
      row.innerHTML = `
        <span class="pattern-name">${name}</span>
        <a class="ext-link" href="${url}" target="_blank" rel="noopener noreferrer" title="View photo">\u2197</a>
      `;
      row.querySelector('.pattern-name').addEventListener('click', () => openDetail(name));
      rowsGrid.appendChild(row);
    });

    main.appendChild(rowsGrid);
  });
}

function openDetail(name) {
  currentPatternIndex = patterns.findIndex(p => p[0] === name);
  view = 'detail';
  renderApp();
}

function renderDetail() {
  const [name, url] = patterns[currentPatternIndex];
  setHeader(true);

  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="page-subtitle">${name}</p>
    <div class="detail-header-block">
      <a class="detail-link" href="${url}" target="_blank" rel="noopener noreferrer">View pattern photo on Replacements.com \u2197</a>
      ${!fbStorage ? '<div class="config-warning">Photo uploads are not active yet. Add your Firebase config near the top of this file to enable saving.</div>' : ''}
    </div>
    <main id="pieceList"></main>
  `;

  const pSlug = slug(name);
  const list = document.getElementById('pieceList');
  list.innerHTML = '';

  pieceTypes.forEach(piece => {
    const pieceSlug = slug(piece);
    const block = document.createElement('div');
    block.className = 'piece-block';
    block.innerHTML = `
      <p class="piece-title">${piece}</p>
      <div class="person-row">
        ${PEOPLE.map(person => `
          <div class="person-col">
            <div class="person-label ${person}">${person === 'cord' ? 'Cord' : 'Mom'}</div>
            <div class="photo-slot" id="slot-${pSlug}-${pieceSlug}-${person}">
              <span class="upload-label">Tap to upload</span>
              <input type="file" accept="image/*" id="file-${pSlug}-${pieceSlug}-${person}">
            </div>
          </div>
        `).join('')}
      </div>
    `;
    list.appendChild(block);
    PEOPLE.forEach(person => setupSlot(pSlug, pieceSlug, person));
  });
}

function setupSlot(pSlug, pieceSlug, person) {
  const slotId = `slot-${pSlug}-${pieceSlug}-${person}`;
  const fileId = `file-${pSlug}-${pieceSlug}-${person}`;
  const slot = document.getElementById(slotId);
  const fileInput = document.getElementById(fileId);
  const path = photoPath(pSlug, pieceSlug, person);

  slot.addEventListener('click', () => {
    if (slot.querySelector('img')) return;
    if (fbStorage) {
      const currentFileInput = document.getElementById(fileId);
      if (currentFileInput) currentFileInput.click();
    }
  });

  fileInput.addEventListener('change', async () => {
    const file = fileInput.files[0];
    if (!file) return;
    slot.classList.add('uploading');
    slot.querySelector('.upload-label').textContent = 'Uploading...';
    try {
      const ref = fbStorage.ref().child(path);
      await ref.put(file);
      const url = await ref.getDownloadURL();
      showPhoto(slot, url, path);
    } catch (err) {
      slot.querySelector('.upload-label').textContent = 'Upload failed \u2014 tap to retry';
      slot.classList.remove('uploading');
      console.error(err);
    }
  });

  if (fbStorage) {
    fbStorage.ref().child(path).getDownloadURL()
      .then(url => showPhoto(slot, url, path))
      .catch(() => { /* no photo yet, leave upload prompt */ });
  }
}

function resetSlotToUpload(slot, fileId) {
  slot.classList.remove('uploading');
  slot.style.cursor = 'pointer';
  slot.innerHTML = `
    <span class="upload-label">Tap to upload</span>
    <input type="file" accept="image/*" id="${fileId}">
  `;
  const newFileInput = document.getElementById(fileId);
  return newFileInput;
}

function showPhoto(slot, url, path) {
  slot.classList.remove('uploading');
  slot.innerHTML = `
    <img src="${url}" alt="">
    <button class="delete-photo-btn" type="button" title="Delete photo">&times;</button>
  `;
  slot.style.cursor = 'pointer';

  const img = slot.querySelector('img');
  img.addEventListener('click', (e) => {
    e.stopPropagation();
    openLightbox(url);
  });

  const deleteBtn = slot.querySelector('.delete-photo-btn');
  deleteBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!confirm('Delete this photo?')) return;
    deleteBtn.disabled = true;
    deleteBtn.textContent = '\u2026';
    try {
      await fbStorage.ref().child(path).delete();
      const fileId = slot.id.replace('slot-', 'file-');
      const newFileInput = resetSlotToUpload(slot, fileId);
      newFileInput.addEventListener('change', async () => {
        const file = newFileInput.files[0];
        if (!file) return;
        slot.classList.add('uploading');
        slot.querySelector('.upload-label').textContent = 'Uploading...';
        try {
          const ref = fbStorage.ref().child(path);
          await ref.put(file);
          const newUrl = await ref.getDownloadURL();
          showPhoto(slot, newUrl, path);
        } catch (err) {
          slot.querySelector('.upload-label').textContent = 'Upload failed \u2014 tap to retry';
          slot.classList.remove('uploading');
          console.error(err);
        }
      });
    } catch (err) {
      alert('Could not delete photo. Check your connection and try again.');
      deleteBtn.disabled = false;
      deleteBtn.textContent = '\u00d7';
      console.error(err);
    }
  });
}

function openLightbox(src) {
  document.getElementById('lightboxImg').src = src;
  document.getElementById('lightbox').classList.add('open');
}

document.getElementById('lightboxClose').addEventListener('click', () => {
  document.getElementById('lightbox').classList.remove('open');
});
document.getElementById('lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'lightbox') document.getElementById('lightbox').classList.remove('open');
});

function openGallery() {
  view = 'gallery';
  renderApp();
}

async function renderGallery() {
  setHeader(false);
  const app = document.getElementById('app');
  app.innerHTML = `
    <p class="page-subtitle">Mom and Cord's Stangl Stash</p>
    <div class="gallery-controls">
      <input type="text" id="gallerySearch" placeholder="Search patterns or pieces...">
      <select id="galleryPersonFilter">
        <option value="all">Cord &amp; Mom</option>
        <option value="cord">Cord only</option>
        <option value="mom">Mom only</option>
      </select>
    </div>
    <div id="galleryGrid" class="gallery-grid"><p class="dashboard-loading">Loading photos...</p></div>
  `;

  if (!fbStorage) {
    document.getElementById('galleryGrid').innerHTML = '<p class="dashboard-note">Connect Firebase (see setup notes at the top of this file) to see uploaded photos.</p>';
    return;
  }

  let photos;
  try {
    photos = await loadAllPhotos();
  } catch (err) {
    document.getElementById('galleryGrid').innerHTML = '<p class="dashboard-note">Could not load photos. Check your Firebase setup and Storage rules.</p>';
    console.error(err);
    return;
  }

  const patternBySlug = new Map(patterns.map(([name]) => [slug(name), name]));
  const pieceBySlug = new Map(pieceTypes.map(p => [slug(p), p]));

  photos.forEach(p => {
    p.patternName = patternBySlug.get(p.pSlug) || p.pSlug;
    p.pieceName = pieceBySlug.get(p.pieceSlug) || p.pieceSlug;
  });

  photos.sort((a, b) =>
    a.patternName.localeCompare(b.patternName) ||
    a.pieceName.localeCompare(b.pieceName) ||
    a.person.localeCompare(b.person)
  );

  window.__galleryPhotos = photos;
  renderGalleryGrid(photos);

  document.getElementById('gallerySearch').addEventListener('input', applyGalleryFilters);
  document.getElementById('galleryPersonFilter').addEventListener('change', applyGalleryFilters);
}

function applyGalleryFilters() {
  const term = (document.getElementById('gallerySearch').value || '').toLowerCase();
  const personFilter = document.getElementById('galleryPersonFilter').value;
  const filtered = (window.__galleryPhotos || []).filter(p => {
    const matchesTerm = p.patternName.toLowerCase().includes(term) || p.pieceName.toLowerCase().includes(term);
    const matchesPerson = personFilter === 'all' || p.person === personFilter;
    return matchesTerm && matchesPerson;
  });
  renderGalleryGrid(filtered);
}

function renderGalleryGrid(photos) {
  const grid = document.getElementById('galleryGrid');
  if (photos.length === 0) {
    grid.innerHTML = '<div class="empty-note">No uploaded photos match yet.</div>';
    return;
  }
  grid.innerHTML = '';
  photos.forEach(p => {
    const tile = document.createElement('div');
    tile.className = 'gallery-tile';
    tile.innerHTML = `
      <div class="gallery-thumb"><img src="${p.url}" alt=""></div>
      <div class="gallery-caption">
        <span class="gallery-pattern">${p.patternName}</span>
        <span class="gallery-piece">${p.pieceName}</span>
        <span class="gallery-person ${p.person}">${p.person === 'cord' ? 'Cord' : 'Mom'}</span>
      </div>
    `;
    tile.querySelector('.gallery-thumb').addEventListener('click', () => openLightbox(p.url));
    tile.querySelector('.gallery-caption').addEventListener('click', () => openDetail(p.patternName));
    grid.appendChild(tile);
  });
}

function renderApp() {
  if (view === 'dashboard') renderDashboardPage();
  else if (view === 'library') renderLibraryPage();
  else if (view === 'gallery') renderGallery();
  else renderDetail();
  updateNavActive();
  window.scrollTo(0, 0);
}

function initPasswordGate() {
  const gate = document.getElementById('passwordGate');
  const input = document.getElementById('passwordInput');
  const submitBtn = document.getElementById('passwordSubmit');
  const errorMsg = document.getElementById('passwordError');

  if (sessionStorage.getItem('stangl_unlocked') === 'true') {
    gate.style.display = 'none';
    return;
  }

  function tryPassword() {
    if (input.value === SITE_PASSWORD) {
      sessionStorage.setItem('stangl_unlocked', 'true');
      gate.style.display = 'none';
    } else {
      errorMsg.textContent = 'Incorrect password, try again.';
      input.value = '';
    }
  }

  submitBtn.addEventListener('click', tryPassword);
  input.addEventListener('keypress', (e) => { if (e.key === 'Enter') tryPassword(); });
  input.focus();
}

function initNav() {
  document.getElementById('siteNav').addEventListener('click', (e) => {
    const btn = e.target.closest('.nav-btn');
    if (!btn) return;
    const dest = btn.dataset.nav;
    if (dest === 'dashboard') openDashboard();
    else if (dest === 'library') openLibrary();
    else if (dest === 'gallery') openGallery();
  });
}

(function init() {
  initPasswordGate();
  initFirebase();
  initNav();
  renderApp();
})();
</script>
